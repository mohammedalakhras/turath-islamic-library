# ============================================================
# إعدادات موقع "مكتبة التراث" — مبني على Jekyll ليعمل مباشرة
# على GitHub Pages بدون أي خطوة بناء يدوية (native Jekyll build)
# ============================================================

title: "مكتبة التراث"
tagline: "مكتبة إلكترونية حرة للكتب الأثرية والتراثية"
description: >-
  أرشيف رقمي مجاني يتيح قراءة وتحميل الكتب التراثية والأثرية كاملة
  دون تحريف أو تلخيص، مع فهارس تفاعلية لكل كتاب وفصل.
lang: ar
locale: ar_AR

url: "https://your-username.github.io"   # عدّل هذا لاحقاً
baseurl: ""                               # اسم المستودع إن لم يكن username.github.io، مثال: "/heritage-library"

logo: /assets/img/logo.svg
twitter_card: summary_large_image
og_image: /assets/img/og-cover.jpg

# ------------------- المجموعات (Collections) -------------------
# كل كتاب = مجلد داخل books/، وكل فصل = ملف داخله
collections:
  books:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: "books"
      type: "books"
    values:
      layout: "chapter"
      sitemap: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# ------------------- Plugins (مدعومة أصلاً على GitHub Pages) -------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# ------------------- تنسيقات Markdown/Kramdown للعربية -------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

# نحتفظ بالنص كما هو حرفياً: لا نعالج أو "نجمّل" علامات الترقيم
kramdown_input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - "*.gemspec"

permalink: /:title/
