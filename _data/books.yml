  summary: >-
    مذكّرة منهجيّة مركّزة في أصول الاستدلال العقدي وإقامة البراهين على أصول الإسلام الكبرى،
    تستهلّ بتأصيل مصادر المعرفة وقواعد التعامل معها، ثم تنتظم في عرض أدلّة وجود الله تعالى
    وبراهين صدق النبوّة المحمديّة وإثبات حجيّة السنّة النبويّة وحفظها. تجمع المذكّرة بين
    تأصيل التراث العقدي ومواكبة الشبهات المعاصرة بأسلوب ميسّر يجمع شتات الباب في متنٍ جامع.
