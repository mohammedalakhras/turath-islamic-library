name: نشر مكتبتي على GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الموقع (Static Export)
        run: npm run build
        env:
          # عدّل هذا السطر فقط إلى دومين موقعك الفعلي (بدون اسم المستودع في النهاية)
          NEXT_PUBLIC_SITE_URL: "https://${{ github.repository_owner }}.github.io"

      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع نتيجة البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: نشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
